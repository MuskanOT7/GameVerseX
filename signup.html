<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login & Signup</title>
  <link rel="stylesheet" href="sign.css">
  <link rel="icon" href="assets\images\game-logo.png">
</head>
<body>
  <div class="form-box">
    <div class="button-box">
      <div id="btn"></div>
      <button type="button" class="toggle-btn" onclick="showLogin()">Login</button>
      <button type="button" class="toggle-btn" onclick="showSignup()">Signup</button>
    </div>

    <!-- Login Form -->
    <form id="login" class="input-group" action="login.php" method="POST">
      <input type="email" class="input-field" name="email" placeholder="Email Address" required>
      <input type="password" class="input-field" name="password" placeholder="Password" required>
      <button type="submit" class="submit-btn">Login</button>
    </form>

    <!-- Signup Form -->
    <form id="signup" class="input-group" action="signup.php" method="POST">
      <input type="text" class="input-field" name="username" placeholder="Username" required>
      <input type="email" class="input-field" name="email" placeholder="Email Address" required>
      <input type="password" class="input-field" name="password" placeholder="Password" required>
      <button type="submit" class="submit-btn">Signup</button>
    </form>
  </div>

  <script>
    const loginForm = document.getElementById("login");
    const signupForm = document.getElementById("signup");
    const btn = document.getElementById("btn");

    function showSignup() {
      loginForm.style.left = "-400px";
      signupForm.style.left = "50px";
      btn.style.left = "110px";
    }

    function showLogin() {
      loginForm.style.left = "50px";
      signupForm.style.left = "450px";
      btn.style.left = "0px";
    }

    window.onload = showLogin; // Default on load
  </script>
</body>
</html>
